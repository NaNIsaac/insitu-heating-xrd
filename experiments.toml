# ─────────────────────────────────────────────────────────────────────────────
# 등온 실험 → Avrami 지수 (uv run python main.py avrami)
# 측정 하나 = 비정질 새 조각 하나. 온도 구간 판별 없이 X 변화만 봄 (처음 프레임 = 0, 마지막 = 1)
# 같은 sample 의 등온 온도가 2개 이상이면 Ea 까지.
#   sample : 시료 종류 (x1 / x2 / x4 / x8). 같은 값끼리 Arrhenius
#   recipe : (선택) 온도 로그. 없으면 n, k 만
#   T_iso  : (선택) 이름 붙이기용 (생략하면 name = sample). 실제 온도는 로그에서 계산
#   t0     : (선택) 변화 시작 시각 "10:15:02". 생략하면 JMAK 피팅으로 구함
#   start / end : (선택) 이 시각 사이 프레임만 — X 의 0 / 1 기준이 되는 처음·끝을 정함
#   name / color : (선택)
# 기존 승온 데이터로 시험: uv run main.py avrami -g exp   (위 [[exp]] 를 그대로 분석, -g exp2 도 가능)
# 측정이 끝나면 아래 예시의 주석(#)을 풀고 경로를 고쳐 쓰기

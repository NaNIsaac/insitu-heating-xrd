<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title description"><title id="title">In-situ XRD measurement pipeline</title><desc id="description">Eiger HDF5 images and temperature controller records are joined by timestamps, integrated into two-theta profiles, and visualized as a time heatmap and peak or transition summaries. The heatmap below is only a schematic.</desc>
<rect x="0" y="0" width="1200" height="570" rx="0" fill="#f7fbfe" stroke="#f7fbfe" stroke-width="2"/>
<text x="34" y="53" font-family="Noto Sans CJK KR, Malgun Gothic, Arial, sans-serif" font-size="29" font-weight="700" fill="#103453">In-situ heating XRD / from detector to transition map</text>
<text x="34" y="82" font-family="Noto Sans CJK KR, Malgun Gothic, Arial, sans-serif" font-size="18" font-weight="400" fill="#58748c">One time axis connects Eiger frames, temperature logs, diffraction and peak tracking.</text>
<rect x="34" y="119" width="268" height="188" rx="15" fill="#fff" stroke="#c6d8e8" stroke-width="2"/>
<rect x="47" y="134" width="39" height="34" rx="9" fill="#e3f2fd" stroke="#e3f2fd" stroke-width="2"/>
<text x="58" y="158" font-family="Noto Sans CJK KR, Malgun Gothic, Arial, sans-serif" font-size="18" font-weight="700" fill="#1d6795">1</text>
<text x="49" y="197" font-family="Noto Sans CJK KR, Malgun Gothic, Arial, sans-serif" font-size="19" font-weight="700" fill="#17476e">Raw measurements</text>
<text x="49" y="232" font-family="Noto Sans CJK KR, Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#385971">Eiger .h5 frames</text>
<text x="49" y="257" font-family="Noto Sans CJK KR, Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#385971">Temperature controller .csv</text>
<text x="49" y="282" font-family="Noto Sans CJK KR, Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#385971">Time stamps from both</text>
<rect x="326" y="119" width="268" height="188" rx="15" fill="#fff" stroke="#c6d8e8" stroke-width="2"/>
<rect x="339" y="134" width="39" height="34" rx="9" fill="#e3f2fd" stroke="#e3f2fd" stroke-width="2"/>
<text x="350" y="158" font-family="Noto Sans CJK KR, Malgun Gothic, Arial, sans-serif" font-size="18" font-weight="700" fill="#1d6795">2</text>
<text x="341" y="197" font-family="Noto Sans CJK KR, Malgun Gothic, Arial, sans-serif" font-size="19" font-weight="700" fill="#17476e">Align &amp; integrate</text>
<text x="341" y="232" font-family="Noto Sans CJK KR, Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#385971">Match absolute timestamps</text>
<text x="341" y="257" font-family="Noto Sans CJK KR, Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#385971">Pixel -&gt; 2θ via QoraGeom</text>
<text x="341" y="282" font-family="Noto Sans CJK KR, Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#385971">2D frame -&gt; 1D profile</text>
<rect x="618" y="119" width="268" height="188" rx="15" fill="#fff" stroke="#c6d8e8" stroke-width="2"/>
<rect x="631" y="134" width="39" height="34" rx="9" fill="#e3f2fd" stroke="#e3f2fd" stroke-width="2"/>
<text x="642" y="158" font-family="Noto Sans CJK KR, Malgun Gothic, Arial, sans-serif" font-size="18" font-weight="700" fill="#1d6795">3</text>
<text x="633" y="197" font-family="Noto Sans CJK KR, Malgun Gothic, Arial, sans-serif" font-size="19" font-weight="700" fill="#17476e">Track physics</text>
<text x="633" y="232" font-family="Noto Sans CJK KR, Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#385971">2θ profile vs time</text>
<text x="633" y="257" font-family="Noto Sans CJK KR, Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#385971">Peak position + area + FWHM</text>
<text x="633" y="282" font-family="Noto Sans CJK KR, Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="400" fill="#385971">Heating / hold / cooling</text>
<rect x="910" y="119" width="268" height="188" rx="15" fill="#fff" stroke="#c6d8e8" stroke-width="2"/>
